<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PurohitSetu Contact Form</title>
</head>
<body>

  <h1>PurohitSetu - Contact Us</h1>

  <!-- CREATE CONTACT -->
  <h2>Send Message</h2>
  <form onsubmit="event.preventDefault(); createMessageFromForm();">
    <input type="text" id="contact-id" placeholder="Message ID" required />
    <input type="text" id="contact-name" placeholder="Full Name" required />
    <input type="email" id="contact-email" placeholder="Email" required />
    <input type="text" id="contact-subject" placeholder="Subject" required />
    <textarea id="contact-message" placeholder="Your Message" required></textarea>
    <button type="submit">Send Message</button>
  </form>

  <h2>View All Messages</h2>
  <form onsubmit="event.preventDefault(); readAllMessagesFromForm();">
    <button type="submit">Read All Messages</button>
  </form>

  <h2>Read Message By ID</h2>
  <form onsubmit="event.preventDefault(); readMessageByIdFromForm();">
    <input type="text" id="read-contact-id" placeholder="Message ID" required />
    <button type="submit">Read Message</button>
  </form>

  <h2>Update Message</h2>
  <form onsubmit="event.preventDefault(); updateMessageFromForm();">
    <input type="text" id="update-contact-id" placeholder="Message ID" required />
    <input type="text" id="update-contact-name" placeholder="Name" required />
    <input type="email" id="update-contact-email" placeholder="Email" required />
    <textarea id="update-contact-message" placeholder="Updated Message" required></textarea>
    <button type="submit">Update Message</button>
  </form>

  <h2>Delete Message</h2>
  <form onsubmit="event.preventDefault(); deleteMessageFromForm();">
    <input type="text" id="delete-contact-id" placeholder="Message ID" required />
    <button type="submit">Delete Message</button>
  </form>

  <script type="module" src="Script.js"></script>

</body>
</html>
